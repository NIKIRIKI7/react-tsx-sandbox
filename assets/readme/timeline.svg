<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="tlTitle tlDesc">
  <title id="tlTitle">Timeline</title>
  <desc id="tlDesc">Normalized timeline with cues, volumes and a smoothed ducking curve.</desc>

  <defs>
    <clipPath id="tlBoard">
      <rect x="160" y="36" width="880" height="180" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="460" rx="28" fill="#080D18"/>
  <text x="64" y="66" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="36" font-weight="800" fill="#E8EEF9">Timeline</text>
  <text x="64" y="98" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="19" fill="#93A4C0">Audio starts together with the first cue — that's the point of the normalization.</text>

  <!-- Board backdrop -->
  <rect x="160" y="36" width="880" height="180" rx="18" fill="#151515" stroke="#4C4C4C" stroke-width="1.5"/>
  <g clip-path="url(#tlBoard)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <!-- cues.json -->
    <g fill="#BDB8A9">
      <rect x="160" y="36" width="880" height="46" fill="none"/>
      <text x="16" y="20" font-size="15">"start": 12.34,</text>
      <text x="16" y="40" font-size="15">"start": 17.05,</text>
    </g>
  </g>

  <!-- Timeline tracks -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <rect x="64" y="140" width="1072" height="250" rx="18" fill="#0E1830" stroke="#2A4A5A" stroke-width="1.5"/>
    <text x="92" y="180" font-size="16" font-weight="700" fill="#C7D3E6">Audio</text>
    <text x="92" y="222" font-size="16" font-weight="700" fill="#C7D3E6" xml:space="preserve">Audio</text>
    <text x="92" y="264" font-size="16" font-weight="700" fill="#C7D3E6">Volume</text>
    <text x="92" y="306" font-size="16" font-weight="700" fill="#C7D3E6">Cues</text>
  </g>

  <rect x="60" y="182" width="1080" height="216" rx="22" fill="#0C1526" stroke="#2A4A5A" stroke-width="1.5"/>
</svg>