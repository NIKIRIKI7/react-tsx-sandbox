<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">browser-tsx-sandbox pipeline</title>
  <desc id="archDesc">Flow: TSX or VFS -&gt; Resolution -&gt; Compilation -&gt; Evaluation -&gt; Render.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3E5375"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#080D18"/>
  <text x="64" y="72" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="40" font-weight="800" fill="#E8EEF9">How it works</text>
  <text x="64" y="108" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#93A4C0">TSX source in, playable preview or MP4 out — the whole pipeline runs in the browser.</text>

  <!-- Flow Boxes -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif">
    <!-- 01 -->
    <rect x="64" y="168" width="190" height="104" rx="16" fill="#0E1830" stroke="#24334F" stroke-width="1.5"/>
    <text x="159" y="198" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#4FDBC8">01</text>
    <text x="159" y="224" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#E8EEF9">Input</text>
    <text x="159" y="250" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">TSX or VFS</text>

    <!-- 02 -->
    <rect x="284" y="168" width="190" height="104" rx="16" fill="#0E1830" stroke="#24334F" stroke-width="1.5"/>
    <text x="379" y="198" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#4FDBC8">02</text>
    <text x="379" y="224" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#E8EEF9">Resolve</text>
    <text x="379" y="250" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">imports + assets</text>

    <!-- 03 -->
    <rect x="504" y="168" width="190" height="104" rx="16" fill="#0E1830" stroke="#24334F" stroke-width="1.5"/>
    <text x="599" y="198" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#4FDBC8">03</text>
    <text x="599" y="224" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#E8EEF9">Compile</text>
    <text x="599" y="250" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">Sucrase → CJS</text>

    <!-- 04 -->
    <rect x="724" y="168" width="190" height="104" rx="16" fill="#0E1830" stroke="#24334F" stroke-width="1.5"/>
    <text x="819" y="198" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#4FDBC8">04</text>
    <text x="819" y="224" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#E8EEF9">Evaluate</text>
    <text x="819" y="250" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">isolated scope</text>

    <!-- 05 -->
    <rect x="944" y="168" width="190" height="104" rx="16" fill="#12243A" stroke="#3A5A6E" stroke-width="1.5"/>
    <text x="1039" y="198" text-anchor="middle" dominant-baseline="central" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" fill="#67E8F9">05</text>
    <text x="1039" y="224" text-anchor="middle" dominant-baseline="central" font-size="22" font-weight="700" fill="#E8EEF9">Render</text>
    <text x="1039" y="250" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#A9BAD6">Player or MP4</text>
  </g>

  <!-- Horizontal Arrows -->
  <g stroke="#3E5375" stroke-width="2" marker-end="url(#arrow)">
    <line x1="254" y1="220" x2="276" y2="220"/>
    <line x1="474" y1="220" x2="496" y2="220"/>
    <line x1="694" y1="220" x2="716" y2="220"/>
    <line x1="914" y1="220" x2="936" y2="220"/>
  </g>

  <text x="64" y="322" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18" fill="#7C90B0">The evaluator shadows window, document, fetch and localStorage to undefined, and interrupts infinite loops.</text>

  <!-- External Inputs -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="18">
    <rect x="274" y="356" width="210" height="80" rx="14" fill="#0B1426" stroke="#2C3E5C" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="379" y="390" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#C4A8FF">npm</text>
    <text x="379" y="414" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">esm.sh / CDN</text>

    <rect x="494" y="356" width="210" height="80" rx="14" fill="#0B1426" stroke="#2C3E5C" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="599" y="390" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#C4A8FF">Web Worker</text>
    <text x="599" y="414" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">compile off-thread</text>

    <rect x="714" y="356" width="210" height="80" rx="14" fill="#0B1426" stroke="#2C3E5C" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="819" y="390" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#C4A8FF">Assets</text>
    <text x="819" y="414" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">blob: → staticFile()</text>

    <rect x="934" y="356" width="210" height="80" rx="14" fill="#0B1426" stroke="#2C3E5C" stroke-width="1.5" stroke-dasharray="6 6"/>
    <text x="1039" y="390" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="#67E8F9">Output</text>
    <text x="1039" y="414" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#93A4C0">&lt;Player /&gt; · MP4</text>
  </g>

  <!-- Vertical Arrows -->
  <g stroke="#3E5375" stroke-width="2" stroke-dasharray="5 5">
    <line x1="379" y1="356" x2="379" y2="284"/>
    <line x1="599" y1="356" x2="599" y2="284"/>
    <line x1="819" y1="356" x2="819" y2="284"/>
    <line x1="1039" y1="356" x2="1039" y2="284"/>
  </g>
  <!-- Arrow Heads -->
  <g fill="#3E5375">
    <polygon points="373,286 385,286 379,274"/>
    <polygon points="593,286 605,286 599,274"/>
    <polygon points="813,286 825,286 819,274"/>
    <polygon points="1033,286 1045,286 1039,274"/>
  </g>
</svg>