<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">browser-tsx-sandbox — React in your browser</title>
  <desc id="heroDesc">Live Editor, Player with safe zones and the timeline of the compiled module.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="55%" stop-color="#111C34"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FDBC8" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#4FDBC8" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C8DB3"/>
      <stop offset="70%" stop-color="#54618A"/>
      <stop offset="100%" stop-color="#3A4564"/>
    </linearGradient>
    <clipPath id="boardClip">
      <rect x="160" y="36" width="880" height="180" rx="18"/>
    </clipPath>
  </defs>

  <rect width="1200" height="460" fill="url(#bg)"/>
  <rect width="1200" height="460" fill="url(#glow)"/>

  <text x="60" y="118" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="50" font-weight="800" fill="#E8EEF9">
    <tspan x="60" dy="0">React</tspan><tspan fill="#4FDBC8" xml:space="preserve"> in your browser</tspan>
  </text>
  <text x="60" y="164" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#93A4C0">Compile TSX with Sucrase, execute in an isolated scope, play the result in⌘ Player — 100% client-side.</text>

  <!-- Code -->
  <circle cx="882" cy="390" r="16" fill="#8C9BFF"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" fill="#8C9BFF" font-weight="700">
    <text x="904" y="386">⌘</text>
    <text x="904" y="412">K</text>
  </g>

  <!-- Editor board -->
  <rect x="60" y="182" width="1080" height="216" rx="22" fill="#0C1526" stroke="#2A4A5A" stroke-width="1.5"/>
</svg>