<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">browser-tsx-sandbox — compile TSX and render Remotion video in the browser</title>
  <desc id="heroDesc">Left: project name and promise. Right: a Scene.tsx code panel, a video preview frame, and a timeline with music, voice, SFX and sticker cues under a playhead.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="1" stop-color="#070B14"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FDBC8" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#C4A8FF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152743"/>
      <stop offset="1" stop-color="#0B1730"/>
    </linearGradient>
    <clipPath id="boardClip">
      <rect x="632" y="34" width="520" height="392" rx="20"/>
    </clipPath>
  </defs>

  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <ellipse cx="990" cy="80" rx="330" ry="190" fill="url(#glow)"/>

  <!-- identity -->
  <g transform="translate(64 110)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', PingFang SC, sans-serif">
    <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" letter-spacing="4" fill="#4FDBC8">BROWSER TSX SANDBOX</text>
    <text y="74" font-size="52" font-weight="800" fill="#E8EEF9">browser-tsx-sandbox</text>
    <text y="124" font-size="22" fill="#93A4C0">Compile TSX and render Remotion video</text>
    <text y="154" font-size="22" fill="#93A4C0">100% in the browser — no server, no bundler.</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
      <text y="216" fill="#7FE7D8">no server  ·  npm via esm.sh</text>
      <text y="242" fill="#8FA2C2">@remotion/player  ·  data-driven timeline</text>
    </g>
  </g>

  <!-- project-native board: code -> preview -> timeline -->
  <g clip-path="url(#boardClip)">
    <rect x="632" y="34" width="520" height="392" fill="#0C1526"/>
    <rect x="632" y="34" width="520" height="42" fill="#101C33"/>

    <g fill="#2C3E5C">
      <circle cx="658" cy="55" r="5"/>
      <circle cx="678" cy="55" r="5"/>
      <circle cx="698" cy="55" r="5"/>
    </g>
    <text x="716" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#93A4C0">Scene.tsx</text>
    <text x="1132" y="61" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#4FDBC8">● live</text>
    <line x1="632" y1="76" x2="1152" y2="76" stroke="#1C2A44" stroke-width="1"/>

    <!-- code -->
    <rect x="648" y="88" width="488" height="136" rx="12" fill="#0A1426" stroke="#1A2840" stroke-width="1"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#E8EEF9">
      <text x="668" y="114"><tspan fill="#4FDBC8">export default function </tspan><tspan fill="#FBBF24">Scene</tspan>() {</text>
      <text x="668" y="138"><tspan fill="#C4A8FF">  const </tspan>frame = <tspan fill="#67E8F9">useCurrentFrame</tspan>();</text>
      <text x="668" y="162"><tspan fill="#C4A8FF">  return </tspan>&lt;AbsoluteFill&gt;</text>
      <text x="668" y="186">    &lt;<tspan fill="#4FDBC8">Audio</tspan> src={<tspan fill="#FBBF24">'bgm.mp3'</tspan>} /&gt;</text>
      <text x="668" y="210">}</text>
    </g>

    <!-- preview -->
    <rect x="648" y="236" width="488" height="104" rx="12" fill="url(#preview)" stroke="#1A2840" stroke-width="1"/>
    <circle cx="792" cy="288" r="34" fill="#4FDBC8" opacity="0.18"/>
    <rect x="866" y="264" width="96" height="48" rx="12" fill="#C4A8FF" opacity="0.22"/>
    <polygon points="884,278 884,298 902,288" fill="#E8EEF9"/>
    <text x="940" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#93A4C0">FRAME 150</text>
    <text x="1116" y="262" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#5E7396">150 / 300</text>

    <!-- timeline -->
    <rect x="648" y="352" width="488" height="74" rx="12" fill="#0A1426" stroke="#1A2840" stroke-width="1"/>
    <g>
      <rect x="660" y="362" width="464" height="10" rx="5" fill="#101C33"/>
      <rect x="660" y="362" width="252" height="10" rx="5" fill="#4FDBC8"/>
      <rect x="660" y="380" width="464" height="10" rx="5" fill="#101C33"/>
      <rect x="712" y="380" width="176" height="10" rx="5" fill="#C4A8FF"/>
      <rect x="660" y="398" width="464" height="10" rx="5" fill="#101C33"/>
      <rect x="690" y="398" width="16" height="10" rx="5" fill="#FBBF24"/>
      <rect x="820" y="398" width="16" height="10" rx="5" fill="#FBBF24"/>
      <rect x="878" y="398" width="16" height="10" rx="5" fill="#FBBF24"/>
      <rect x="660" y="416" width="464" height="10" rx="5" fill="#101C33"/>
      <rect x="712" y="416" width="52" height="10" rx="5" fill="#67E8F9"/>
    </g>
    <line x1="912" y1="352" x2="912" y2="426" stroke="#4FDBC8" stroke-width="2"/>
    <polygon points="906,352 918,352 912,360" fill="#4FDBC8"/>
  </g>

  <rect x="632" y="34" width="520" height="392" rx="20" fill="none" stroke="#22314C" stroke-width="1.5"/>
</svg>
